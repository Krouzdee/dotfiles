source= ~/.config/hypr/colors.conf


### MONITORS ###
monitor = , preferred, auto, 1
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true

### MY PROGRAMS ###
$terminal = foot
$fileManager = thunar
$browser = firefox
$menu = qs -c noctalia-shell ipc call launcher toggle
$editor = vscodium

### AUTOSTART ###
exec-once = qs -c noctalia-shell  
exec-once = firefox
exec-once = systemctl --user start hyprpolkitagent
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# exec-once = blueman-applet

### ENVIRONMENT VARIABLES ###
source= ~/.config/hypr/environment.conf


### LOOK AND FEEL ###
source= ~/.config/hypr/configs/looknfeel.conf


### ANIMATIONS ###
source= ~/.config/hypr/configs/UserAnimations.conf


### WINDOWRULES AND LAYERRULES ###
source = ~/.config/hypr/configs/windowrules.conf

dwindle {
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 
    disable_hyprland_logo = true
    initial_workspace_tracking = 1
    focus_on_activate = false
}

### INPUT ###
source= ~/.config/hypr/configs/input.conf


### KEYBINDS ###
source= ~/.config/hypr/configs/keybinds.conf


### COLORS ###
source = ~/.config/hypr/noctalia/noctalia-colors.conf

